name: Screenshots

# Run by hand (Actions → Screenshots → Run workflow). Takes screenshots of the
# PC app and the Android app with a few public-domain sample books, and uploads
# them as a download. Nothing is published or committed.
on:
  workflow_dispatch:

jobs:
  books:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/screenshots/get_books.sh books
      - uses: actions/upload-artifact@v4
        with: { name: sample-books, path: books }

  desktop:
    needs: books
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: sample-books, path: books }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-color-emoji fonts-noto
          cd desktop && npm install --no-audit --no-fund --omit=dev
          pip install playwright && python -m playwright install --with-deps chromium
      - name: Screenshots
        run: |
          cd desktop && (node server.js > ../server.log 2>&1 &) && cd ..
          for i in $(seq 30); do curl -sf http://127.0.0.1:47321/api/info && break; sleep 1; done
          python tools/screenshots/desktop.py books shots
          cat server.log | tail -20
      - uses: actions/upload-artifact@v4
        with: { name: screenshots-pc, path: shots }

  android:
    needs: books
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: sample-books, path: books }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build debug APK
        env:
          GITHUB_RUN_NUMBER: '999999'
        run: gradle assembleDebug --no-daemon
      - name: Sample library
        run: python3 tools/screenshots/android_seed.py books seed
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 tools/screenshots/android.py app/build/outputs/apk/debug/app-debug.apk seed shots
      - uses: actions/upload-artifact@v4
        with: { name: screenshots-android, path: shots }

  # Also put the images on a "screenshots-raw" branch, so they can be looked at
  # without downloading the zip files.
  publish:
    needs: [desktop, android]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: 'screenshots-*', path: shots, merge-multiple: true }
      - name: Push to screenshots-raw branch
        run: |
          cd shots
          git init -q -b screenshots-raw
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Screenshots from run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots-raw
