name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'tools/**'
      - '**.md'
      - '.github/workflows/screenshots.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Natural offline voices (Kokoro / Piper) run on the phone with sherpa-onnx (Apache-2.0).
      # Its native libraries and Kotlin API file are fetched here at a pinned version, not kept in this repository.
      - name: Fetch sherpa-onnx runtime
        run: bash tools/fetch_sherpa.sh

      # The "hard cases" book (tools/torture.txt): every sentence must be read or skipped, never get stuck
      - name: Hard-cases tests (phone)
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Hard-cases tests (PC and audiobook maker)
        run: node desktop/test/hardcases.test.js

      # the phone's tests wrote what its rules make of shared examples; the PC/maker rules must make the same
      - name: Phone and PC read text the same way
        run: node desktop/test/parity.test.js

      - name: Background sounds (PC)
        run: node desktop/test/ambience.test.js

      # the signing key comes from the repository's secrets when they're set (see README → Signing key)
      - name: Signing key
        env:
          KS: ${{ secrets.SHELF_KEYSTORE_B64 }}
        if: env.KS != ''
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/shelf.keystore"
          echo "SHELF_KEYSTORE=$RUNNER_TEMP/shelf.keystore" >> "$GITHUB_ENV"

      - name: Build
        env:
          SHELF_KEYSTORE_PASSWORD: ${{ secrets.SHELF_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease -PabiSplits --no-daemon --stacktrace

      # ShelfReader.apk is for 64-bit phones (nearly all); ShelfReader-32bit.apk for older 32-bit ones
      - name: Rename APKs
        run: |
          ls -la app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk ShelfReader.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk ShelfReader-32bit.apk
          ls -la ShelfReader*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ShelfReader-apk
          path: ShelfReader*.apk

      # pull requests only check that the app builds; releases come from main.
      # Every build is published as Beta (a pre-release) straight away; "promote" makes it Stable once every test passed.
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Shelf Reader (build ${{ github.run_number }})
          prerelease: true
          make_latest: false
          body: "Beta until every test passes, then Stable. Android: download ShelfReader.apk and open it on your phone (or use Menu → Check for updates in the app); for an older 32-bit phone, ShelfReader-32bit.apk. Windows: download ShelfReader-Setup.exe to install, or ShelfReader-Windows.zip to run without installing (unzip it, then open Shelf Reader.exe)."
          files: |
            ShelfReader.apk
            ShelfReader-32bit.apk

  desktop:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Set version
        working-directory: desktop
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version

      - name: Build Windows app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis zip --publish never

      - name: Check update files
        working-directory: desktop
        shell: bash
        run: |
          ls -la dist
          test -f dist/latest.yml
          test -f dist/ShelfReader-Setup.exe.blockmap
          cat dist/latest.yml

      - name: Add to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: |
            desktop/dist/ShelfReader-Setup.exe
            desktop/dist/ShelfReader-Setup.exe.blockmap
            desktop/dist/latest.yml
            desktop/dist/ShelfReader-Windows.zip
          prerelease: true
          make_latest: false

  # Reads the whole "hard cases" book on an Android emulator, with the phone's voice and with a natural voice.
  # Reading must reach the end without getting stuck.
  readtest:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { voice: 'default', mode: 'read', ram: '2048M' }
          - { voice: 'vits-piper-en_US-lessac-medium', mode: 'read', ram: '2048M' }
          # Kokoro on a phone with little memory, where it used to close the app
          - { voice: 'kokoro-int8-en-v0_19', mode: 'voice', ram: '1536M' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Fetch sherpa-onnx runtime
        env: { ABIS: 'x86_64' }
        run: bash tools/fetch_sherpa.sh
      # the release build (with unused code removed), so what's tested is what phones get
      - name: Build test app
        run: gradle assembleRelease -PtestAssets --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Read the hard-cases book
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: ${{ matrix.ram }}
          disk-size: 6G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: APK=app/build/outputs/apk/release/app-release.apk bash tools/voicetest.sh "${{ matrix.voice }}" ${{ matrix.mode }}
      - name: Check it reached the end
        run: |
          grep -E "SELFTEST|STALL|stalls recovered" voicetest.log | tail -5 || true
          grep -q "SELFTEST DONE OK" voicetest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readtest-${{ matrix.voice }}-${{ matrix.ram }}
          path: voicetest.log

  # Every test passed and the Windows app was added: this build becomes the Stable release.
  promote:
    needs: [desktop, readtest]
    runs-on: ubuntu-latest
    steps:
      - name: Make this build Stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "build-${{ github.run_number }}" -R "${{ github.repository }}" --prerelease=false --latest
