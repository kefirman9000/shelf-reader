name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'tools/**'
      - '**.md'
      - '.github/workflows/screenshots.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Natural offline voices (Kokoro / Piper) run on the phone with sherpa-onnx (Apache-2.0).
      # Its native libraries and Kotlin API file are fetched here at a pinned version, not kept in this repository.
      - name: Fetch sherpa-onnx runtime
        run: |
          set -e
          V=1.12.14
          mkdir -p /tmp/so app/src/main/java/com/k2fsa/sherpa/onnx
          curl -fsSL -o /tmp/so.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$V/sherpa-onnx-v$V-android.tar.bz2"
          tar xjf /tmp/so.tar.bz2 -C /tmp/so
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p app/src/main/jniLibs/$abi
            found=$(find /tmp/so -type d -name "$abi" | head -1)
            test -n "$found"
            cp "$found"/*.so app/src/main/jniLibs/$abi/
          done
          ls -la app/src/main/jniLibs/*
          curl -fsSL -o app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt "https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/v$V/sherpa-onnx/kotlin-api/Tts.kt"

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ShelfReader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ShelfReader-apk
          path: ShelfReader.apk

      # pull requests only check that the app builds; releases come from main
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Shelf Reader (build ${{ github.run_number }})
          body: "Android: download ShelfReader.apk and open it on your phone (or use Menu → Check for updates in the app). Windows: download ShelfReader-Setup.exe to install, or ShelfReader-Windows.zip to run without installing (unzip it, then open Shelf Reader.exe)."
          files: ShelfReader.apk
          make_latest: true

  desktop:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Set version
        working-directory: desktop
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version

      - name: Build Windows app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis zip --publish never

      - name: Check update files
        working-directory: desktop
        shell: bash
        run: |
          ls -la dist
          test -f dist/latest.yml
          test -f dist/ShelfReader-Setup.exe.blockmap
          cat dist/latest.yml

      - name: Add to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: |
            desktop/dist/ShelfReader-Setup.exe
            desktop/dist/ShelfReader-Setup.exe.blockmap
            desktop/dist/latest.yml
            desktop/dist/ShelfReader-Windows.zip
