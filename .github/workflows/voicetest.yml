name: Voice test

# Run by hand. Installs the app on an Android emulator, downloads a natural voice,
# makes and plays speech, and saves the log (including any crash) to the "voicetest-raw" branch.
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Voice model id'
        default: 'kokoro-en-v0_19'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Fetch sherpa-onnx runtime
        env: { ABIS: 'x86_64' }
        run: bash tools/fetch_sherpa.sh
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tools/voicetest.sh "${{ github.event.inputs.model }}"
      - name: Save log
        if: always()
        run: |
          mkdir -p out && cp -f voicetest.log out/ 2>/dev/null || echo "no log" > out/voicetest.log
          cd out && git init -q -b voicetest-raw && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "Voice test ${{ github.run_number }}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" voicetest-raw
